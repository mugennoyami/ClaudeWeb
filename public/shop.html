<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop – COLDSTART</title>
  <meta name="description" content="Tuning-Teile, Track-Teile, CNC-Teile, 3D-Druck und Sticker für BMW E36 und E46. Klare Preise inkl. MwSt. und ehrliche Zulassungs-Hinweise.">
  <meta name="theme-color" content="#030405">
  <meta property="og:title" content="COLDSTART Shop">
  <meta property="og:type" content="website">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/css/fonts.css">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script src="/assets/js/boot.js"></script>
</head>
<body>
<div id="site-header"></div>

<main id="main" class="container page-shop">
  <header class="page-top">
    <p class="eyebrow eyebrow-accent">Shop</p>
    <h1 class="page-title">Teile für deinen BMW</h1>
    <p class="page-lead">Tuning, Track, CNC, 3D-Druck und Sticker. Klare Preise inkl. MwSt., ehrliche Hinweise zur Zulassung und Versand ohne Überraschungen.</p>
    <ul class="trustbar" id="trustbar" aria-label="Shop-Vorteile"></ul>
  </header>

  <div class="filters">
    <ul class="chips" id="cat-chips" aria-label="Kategorien">
      <li><button class="chip chip-filter" type="button" data-category="" aria-pressed="true">Alle</button></li>
    </ul>
    <div class="toolbar">
      <label class="search">
        <svg class="icon icon-sm" aria-hidden="true"><use href="#i-search"/></svg>
        <span class="sr-only">Produkte suchen</span>
        <input id="q" type="search" placeholder="Suchen, z. B. Halter oder E46" autocomplete="off" maxlength="80">
      </label>
      <label class="sr-only" for="sort">Sortieren nach</label>
      <select id="sort">
        <option value="">Empfohlen</option>
        <option value="neu">Neu zuerst</option>
        <option value="preis_asc">Preis aufsteigend</option>
        <option value="preis_desc">Preis absteigend</option>
        <option value="name">Name A–Z</option>
      </select>
    </div>
  </div>

  <p class="result-count" id="count" aria-live="polite"></p>

  <div class="product-grid" id="grid" aria-live="polite">
    <div class="skeleton" aria-hidden="true"></div>
    <div class="skeleton" aria-hidden="true"></div>
    <div class="skeleton" aria-hidden="true"></div>
  </div>

  <div class="cart-reminder" id="reminder" hidden>
    <p id="reminder-text"></p>
    <a class="btn btn-track btn-sm" href="/warenkorb">Zum Warenkorb</a>
  </div>
</main>

<div id="site-footer"></div>
<script type="module" src="/assets/js/shop.js"></script>
</body>
</html>
